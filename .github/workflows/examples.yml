name: Verify examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          pip install --quiet ruff==0.16.3
          ruff check examples tests
      - name: Compile examples
        run: python -m compileall -q examples tests
      - name: Run executable checks
        run: python -m unittest discover -s tests -v
      - name: Smoke-test every example
        run: |
          for example in examples/*_example.py; do
            python "$example" > /dev/null
          done
